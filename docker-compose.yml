
services:
  zk-frontend-dev:
    image: ivanmatcuka/zk-frontend-dev
    container_name: zk-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
    
    env_file: .env

    networks:
      - zk-network-dev

  zk-tunnel-dev:
    image: ivanmatcuka/matcuka_tunnel
    container_name: zk-tunnel-dev
    
    env_file:
      - .env

    restart: unless-stopped
    networks:
      - zk-network-dev

networks:
  zk-network-dev: