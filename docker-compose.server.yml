services:
  zk-strapi-dev:
    image: strapi/strapi
    container_name: zk-strapi-dev

    environment:
      - NODE_ENV=development
      - HOST=${NEXT_PUBLIC_API_URL}

    restart: unless-stopped
    networks:
      - zk-strapi-network-dev
    volumes:
      - zk-db-dev:/opt/app/.tmp

  zk-strapi-tunnel-dev:
    image: ivanmatcuka/matcuka_tunnel
    container_name: zk-strapi-tunnel-dev

    env_file:
      - .env
    environment:
      - TUNNEL_SUBDOMAIN=${TUNNEL_SUBDOMAIN_API}
      - TUNNEL_LOCAL_HOST=${TUNNEL_LOCAL_HOST_API}
      - TUNNEL_PORT=${TUNNEL_PORT_API}

    depends_on:
      - zk-strapi-dev

    restart: unless-stopped
    networks:
      - zk-strapi-network-dev

networks:
  zk-strapi-network-dev:

volumes:
  zk-db-dev:
